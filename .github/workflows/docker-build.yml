name: Build and Push Docker Images

# 添加权限设置
permissions:
  contents: read
  packages: write

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号 (例如: 1.0.0)'
        required: true
        default: 'latest'
  # 仅当创建符合语义化版本的标签时自动触发
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'       # 匹配标准三位版本号: v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-*'     # 匹配带预发布后缀的版本: v1.2.3-alpha

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64,amd64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/private-permanently
          tags: |
            # 对于手动触发，使用输入的版本号
            type=raw,value=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
            # 对于标签推送，根据语义化版本生成标签
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=semver,pattern={{major}},prefix=v
            # 如果是最新的发布版本，添加 latest 标签
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,scope=${{ github.workflow }},mode=max