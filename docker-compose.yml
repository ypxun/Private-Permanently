version: '3.8'

services:
  private-permanently:
    container_name: private-permanently
    image:
    ports:
      - "15300:15300"
    environment:
      - NODE_ENV=production
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - CACHE_ENABLED=true
      - CACHE_TTL=60
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:15300/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s